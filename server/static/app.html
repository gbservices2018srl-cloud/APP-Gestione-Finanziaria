<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Smile — Gestione Finanziaria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#3B2647;
  --navy-2:#5A3D68;
  --teal:#2F8F9E;
  --teal-light:#e6f4f5;
  --amber:#D4A017;
  --yellow:#F1E44D;
  --purple:#A36EA6;
  --purple-light:#f3ecf4;
  --red:#c0483f;
  --green:#3f8f5c;
  --bg:#f6f5f3;
  --card:#ffffff;
  --border:#e2dde3;
  --text:#241a29;
  --text-soft:#655a6b;
  --radius:10px;
  --mono: 'SF Mono', 'Consolas', monospace;
  --font-brand: 'Poppins', sans-serif;
  --font-body: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
}
#app{display:flex; min-height:100vh;}

/* SIDEBAR */
#sidebar{
  width:230px; flex-shrink:0; background:var(--navy); color:#fff;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#sidebar .brand{padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.14); text-align:center;}
#sidebar .brand img{max-width:150px; width:100%; height:auto; display:block; margin:0 auto 8px; background:#fff; border-radius:10px; padding:8px 10px;}
#sidebar .brand span{display:block; font-weight:600; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--yellow); margin-top:2px;}
#sidebar nav{flex:1; padding:10px 0;}
#sidebar .nav-company-label{padding:10px 18px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--yellow); font-weight:700; font-family:var(--font-brand);}
#sidebar button.navbtn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  color:#d9cbdd; padding:11px 18px; font-size:13.5px; cursor:pointer; border-left:3px solid transparent;
  font-family:var(--font-brand); font-weight:500;
}
#sidebar button.navbtn:hover{background:rgba(255,255,255,.07);}
#sidebar button.navbtn.active{background:rgba(255,255,255,.1); color:#fff; border-left:3px solid var(--yellow); font-weight:700;}
#sidebar .navico{width:18px; text-align:center; font-size:14px;}
#sidebar .foot{padding:14px 18px; font-size:11px; opacity:.6; border-top:1px solid rgba(255,255,255,.14);}

/* MAIN */
#main{flex:1; min-width:0; padding:26px 32px 60px; max-width:1400px;}
h1.pagetitle{font-family:var(--font-brand); font-weight:700; font-size:22px; margin:0 0 3px; color:var(--navy);}
p.pagesub{margin:0 0 22px; color:var(--text-soft); font-size:13.5px;}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;}
.card h2{font-family:var(--font-brand); font-weight:700; font-size:14.5px; margin:0 0 14px; color:var(--teal); text-transform:uppercase; letter-spacing:.04em;}
.card h3{font-family:var(--font-brand); font-weight:700; font-size:13px; margin:18px 0 8px; color:var(--navy-2);}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
.kpi{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; border-top:3px solid var(--purple);}
.kpi .label{font-size:11.5px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.04em;}
.kpi .value{font-family:var(--font-brand); font-size:23px; font-weight:700; color:var(--navy); margin-top:4px;}
.kpi .sub{font-size:12px; margin-top:4px;}
.kpi .sub.pos{color:var(--green);}
.kpi .sub.neg{color:var(--red);}

table.datatable{width:100%; border-collapse:collapse; font-size:12.8px;}
table.datatable th{
  text-align:right; padding:7px 8px; background:var(--teal-light); color:var(--teal);
  font-weight:700; font-size:11.3px; text-transform:uppercase; letter-spacing:.02em; position:sticky; top:0;
  font-family:var(--font-brand);
}
table.datatable th:first-child, table.datatable td:first-child{text-align:left; position:sticky; left:0; background:#fff; z-index:1;}
table.datatable th:first-child{background:var(--teal-light); z-index:2;}
table.datatable td{padding:5px 8px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap;}
table.datatable tr.cat-row td{background:var(--purple-light); font-weight:700; color:var(--navy); padding-top:9px; font-family:var(--font-brand);}
table.datatable tr.total-row td{background:#eaf6f4; font-weight:700; border-top:2px solid var(--teal);}
table.datatable input{
  width:90px; padding:4px 5px; border:1px solid var(--border); border-radius:5px; text-align:right; font-size:12.5px;
  font-family:var(--mono);
}
table.datatable input:focus{outline:2px solid var(--teal); border-color:var(--teal);}
table.datatable select{
  padding:4px 5px; border:1px solid var(--border); border-radius:5px; font-size:12px; max-width:170px;
}
table.datatable select:focus{outline:2px solid var(--teal); border-color:var(--teal);}
.table-scroll{overflow-x:auto; max-width:100%;}
.neg{color:var(--red);}
.pos{color:var(--green);}

.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.tabs button{
  padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:12.5px; color:var(--text-soft);
}
.tabs button.active{background:var(--navy); color:#fff; border-color:var(--navy);}

.input-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
.input-row label{font-size:12.5px; color:var(--text-soft); min-width:150px;}
.input-row input, .input-row select{padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px; width:120px;}

.btn{
  background:var(--teal); color:#fff; border:none; padding:8px 16px; border-radius:7px; font-size:12.8px; cursor:pointer; font-weight:700;
  font-family:var(--font-brand);
}
.btn.secondary{background:#fff; color:var(--purple); border:1px solid var(--purple);}
.btn.danger{background:var(--red);}
.btn:hover{filter:brightness(1.07);}
.btn-row{display:flex; gap:10px; margin:12px 0; flex-wrap:wrap;}

.badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;}
.badge.ok{background:#e2f4e8; color:var(--green);}
.badge.warn{background:#fdf3cf; color:#8a6d00;}
.badge.bad{background:#fbe4e2; color:var(--red);}

.notebox{background:#fdf7e0; border:1px solid var(--yellow); border-radius:8px; padding:12px 16px; font-size:12.8px; color:#6b5c00; margin-bottom:16px;}
.notebox.fix{background:var(--purple-light); border-color:#d7c0da; color:#5a2f60;}

.site-selector{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.site-selector button{padding:6px 12px; border-radius:7px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:12.5px;}
.site-selector button.active{background:var(--teal); color:#fff; border-color:var(--teal);}
.site-selector button.total-tab{border-color:var(--purple); color:var(--purple); font-weight:700;}
.site-selector button.total-tab.active{background:var(--purple); color:#fff;}

.site-chip{display:inline-flex; align-items:center; gap:2px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:2px 4px 2px 4px;}
.site-chip.active{border-color:var(--teal); background:var(--teal-light);}
.site-chip-name{background:none; border:none; padding:5px 6px; font-size:12.8px; cursor:pointer; font-weight:600; color:var(--navy);}
.site-chip.active .site-chip-name{color:var(--teal);}
.icon-btn{background:none; border:none; cursor:pointer; font-size:12px; padding:4px 5px; border-radius:5px; color:var(--text-soft);}
.icon-btn:hover{background:rgba(0,0,0,.06); color:var(--red);}

.cat-summary-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.cat-summary-row .cat-total{color:var(--teal); font-weight:600; margin-left:8px;}
.cat-actions{display:flex; gap:2px; flex-shrink:0;}
.cat-actions .icon-btn{color:#8aa0a8;}
.cat-actions .icon-btn:hover{color:var(--red); background:rgba(0,0,0,.08);}

.item-row{align-items:center;}
.item-name-input{
  border:1px solid transparent; background:transparent; font-size:12.8px; color:var(--text);
  padding:4px 6px; border-radius:5px; min-width:220px; flex:1;
}
.item-name-input:hover{border-color:var(--border);}
.item-name-input:focus{outline:none; border-color:var(--teal); background:#fff;}

.chart-wrap{position:relative; height:280px; margin-top:10px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

details.cat-collapse{margin-bottom:6px;}
details.cat-collapse summary{cursor:pointer; padding:8px 10px; background:#eef2f3; border-radius:6px; font-weight:700; color:var(--navy); font-size:12.8px; list-style:none;}
details.cat-collapse summary::-webkit-details-marker{display:none;}
details.cat-collapse summary:before{content:'▸ '; }
details.cat-collapse[open] summary:before{content:'▾ '; }

.supplier-list{margin:6px 0 10px 20px;}
.supplier-row{display:flex; gap:8px; align-items:center; margin-bottom:4px;}
.supplier-row input[type=text]{width:180px; padding:4px 6px; border:1px solid var(--border); border-radius:5px; font-size:12px;}
.supplier-row input[type=number]{width:90px;}
.supplier-row button{background:none; border:none; color:var(--red); cursor:pointer; font-size:13px;}
.small-btn{font-size:11.5px; padding:3px 8px; border-radius:5px; border:1px solid var(--border); background:#fff; cursor:pointer; color:var(--teal);}

.status-banner{position:fixed; bottom:16px; right:16px; background:var(--navy); color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; opacity:0; transition:opacity .3s; z-index:999;}
.status-banner.show{opacity:1;}

.help-tip{font-size:11.8px; color:var(--text-soft); margin-bottom:10px; line-height:1.5;}

.reset-panel{border:1px solid #f0c4c0; background:#fdf3f2; border-radius:8px; padding:4px 14px 10px; margin-top:6px;}

.auth-wrap{display:flex; align-items:flex-start; justify-content:center; padding-top:40px;}
.auth-box{background:#fff; border:1px solid var(--border); border-radius:14px; padding:32px 36px; max-width:440px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.06);}
.auth-box h1.pagetitle{text-align:left;}
.auth-form .input-row label{min-width:130px;}
.auth-company-list{display:flex; flex-direction:column; gap:6px; margin:14px 0;}
.auth-company-row{border:1px solid var(--border); border-radius:8px; padding:4px 6px;}
.auth-company-btn{width:100%; text-align:left; background:none; border:none; padding:10px 8px; font-size:14px; font-weight:600; color:var(--navy); cursor:pointer; border-radius:6px;}
.auth-company-btn:hover{background:var(--teal-light);}
.auth-company-row .input-row{padding:6px 4px 2px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(36,26,41,.55); z-index:2000;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-box{
  background:#fff; border-radius:14px; padding:22px 24px; max-width:420px; width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.modal-box h3{font-family:var(--font-brand); font-size:15px; margin:0 0 14px; color:var(--navy);}
.modal-box .modal-msg{font-size:13.5px; line-height:1.55; color:var(--text); margin:0 0 16px;}
.modal-box .modal-input{
  width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:7px; font-size:14px; margin-bottom:6px;
}
.modal-box .modal-input:focus{outline:2px solid var(--teal); border-color:var(--teal);}
.modal-box .modal-error{color:var(--red); font-size:12px; margin:4px 0 0;}
.modal-btns{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}

.money-cell{position:relative; display:inline-block;}
.money-cell input{padding-right:15px !important;}
.money-cell::after{content:'\20AC'; position:absolute; right:5px; top:50%; transform:translateY(-50%); font-size:10.5px; color:var(--text-soft); pointer-events:none;}
.input-row .money-cell input{width:140px;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:#c9d3d6; border-radius:4px;}
.download-btn{background:var(--purple); color:#fff; border:none; padding:8px 16px; border-radius:7px; font-size:12.8px; cursor:pointer; font-weight:700; font-family:var(--font-brand); display:inline-flex; align-items:center; gap:6px; margin-bottom:16px;}
.download-btn:hover{filter:brightness(1.08);}

@media print{
  #sidebar, .status-banner, .btn-row, .download-btn-wrap, .tabs, .site-selector, .modal-overlay{ display:none !important; }
  #app{display:block !important;}
  #main{padding:0 !important; max-width:100% !important;}
  body{background:#fff !important;}
  .card{border:1px solid #ccc !important; box-shadow:none !important; break-inside:avoid; page-break-inside:avoid; margin-bottom:14px !important;}
  .kpi-grid{break-inside:avoid;}
  .kpi{border:1px solid #ccc !important; break-inside:avoid;}
  table.datatable{font-size:10px !important;}
  table.datatable input, table.datatable select{border:none !important; background:none !important; color:#000 !important; padding:0 !important;}
  .chart-wrap{break-inside:avoid;}
  h1.pagetitle{margin-top:0 !important;}
}
</style>
</head>

function sanitizeState(parsed){
var d = defaultState();
var out = parsed || {};
['sites','fixedCats','fixedItems','varCats','listino','bankAccounts','statsYears'].forEach(function(k){ if(!Array.isArray(out[k])) out[k]=d[k]; });
['budget','consuntivo','incassi','bankBalances'].forEach(function(k){ if(typeof out[k] !== 'object' || out[k]===null) out[k]=d[k]; });
if(!out.currentYear || typeof out.currentYear!=='number') out.currentYear = d.currentYear;
['fixed','varPct','ammPct','revenue','guadagnoPct','oneTimeNewUL'].forEach(function(k){ if(!out.budget[k]) out.budget[k]={}; });
['revenue','produzione','fixed','varCat','mesiOverride'].forEach(function(k){ if(!out.consuntivo[k]) out.consuntivo[k]={}; });
['tmv','conv','splitPVest','splitPVint','splitOVint','splitNC'].forEach(function(f){ if(!out.incassi[f]) out.incassi[f]={}; });
out.sites.forEach(function(site){
if(!out.consuntivo.revenue[site.id]) out.consuntivo.revenue[site.id] = MONTHS.map(function(){return 0;});
if(!out.consuntivo.produzione[site.id]) out.consuntivo.produzione[site.id] = MONTHS.map(function(){return 0;});
if(out.consuntivo.mesiOverride[site.id]===undefined) out.consuntivo.mesiOverride[site.id] = null;
['ammPct','revenue','guadagnoPct','oneTimeNewUL'].forEach(function(f){ if(out.budget[f][site.id]===undefined) out.budget[f][site.id] = (f==='ammPct'?0.04:(f==='guadagnoPct'?0.25:0)); });
['tmv','conv','splitPVest','splitPVint','splitOVint','splitNC'].forEach(function(f){ if(out.incassi[f][site.id]===undefined) out.incassi[f][site.id] = (f==='tmv'?2500:(f==='conv'?0.5:0.25)); });
});
out.fixedItems.forEach(function(it){
if(!out.budget.fixed[it.id]) out.budget.fixed[it.id] = {};
if(!out.consuntivo.fixed[it.id]) out.consuntivo.fixed[it.id] = {};
out.sites.forEach(function(site){
if(out.budget.fixed[it.id][site.id]===undefined) out.budget.fixed[it.id][site.id] = 0;
if(!out.consuntivo.fixed[it.id][site.id]) out.consuntivo.fixed[it.id][site.id] = newConsFixedEntry();
});
});
out.varCats.forEach(function(c){
if(!out.budget.varPct[c.id]) out.budget.varPct[c.id] = {};
if(!out.consuntivo.varCat[c.id]) out.consuntivo.varCat[c.id] = {};
out.sites.forEach(function(site){
if(out.budget.varPct[c.id][site.id]===undefined) out.budget.varPct[c.id][site.id] = 0;
if(!out.consuntivo.varCat[c.id][site.id]) out.consuntivo.varCat[c.id][site.id] = newConsVarEntry(c.suppliers);
});
});
out.statsYears.forEach(function(y){
if(!y.revenue) y.revenue = {};
if(!y.produzione) y.produzione = {};
out.sites.forEach(function(site){
if(!y.revenue[site.id]) y.revenue[site.id] = MONTHS.map(function(){return 0;});
if(!y.produzione[site.id]) y.produzione[site.id] = MONTHS.map(function(){return 0;});
});
});
out.bankAccounts.forEach(function(a){
if(!out.bankBalances[a.id] || Array.isArray(out.bankBalances[a.id])) out.bankBalances[a.id] = {};
if(!out.bankBalances[a.id][out.currentYear]) out.bankBalances[a.id][out.currentYear] = MONTHS.map(function(){return 0;});
out.statsYears.forEach(function(y){ if(!out.bankBalances[a.id][y.year]) out.bankBalances[a.id][y.year] = MONTHS.map(function(){return 0;}); });
});
return out;
}

function downloadCsv(filename, headers, rows){
function esc(v){
if(typeof v === 'number') return String(v).replace('.', ',');
var s = String(v===null||v===undefined?'':v);
return '"'+s.replace(/"/g,'""')+'"';
}
var lines = [headers.map(esc).join(';')];
rows.forEach(function(r){ lines.push(r.map(esc).join(';')); });
var csvContent = '\uFEFF' + lines.join('\r\n');
var blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url; a.download = filename;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
URL.revokeObjectURL(url);
}

/* legge un file CSV/Excel in modo tollerante: capisce da solo se il
separatore \u00e8 ";" o "," (dipende da come Excel lo ha salvato), gestisce
i campi tra virgolette e toglie un'eventuale riga di intestazione */
function parseCsvFile(text){
text = text.replace(/^\uFEFF/, '').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
var lines = text.split('\n').filter(function(l){ return l.trim()!==''; });
if(!lines.length) return [];
var semiCount = (lines[0].match(/;/g)||[]).length;
var commaCount = (lines[0].match(/,/g)||[]).length;
var delim = semiCount >= commaCount ? ';' : ',';
function parseLine(line){
var out = []; var cur=''; var inQ=false;
for(var i=0;i<line.length;i++){
var ch = line[i];
if(inQ){
if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
else cur+=ch;
} else {
if(ch==='"') inQ=true;
else if(ch===delim){ out.push(cur); cur=''; }
else cur+=ch;
}
}
out.push(cur);
return out.map(function(c){ return c.trim(); });
}
return lines.map(parseLine);
}
function parseFlexibleNumber(str){
var s = String(str||'').trim().replace(/[^\d,.\-]/g,'');
if(!s) return NaN;
var lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
if(lastComma>-1 && lastComma>lastDot){ s = s.replace(/\./g,'').replace(',', '.'); }
else { s = s.replace(/,/g,''); }
var v = parseFloat(s);
return v;
}

function bindNum(getSet, opts){
opts = opts||{};
var inp = document.createElement('input');
inp.type='number'; inp.step = opts.step||'any';
inp.value = getSet.get();
inp.placeholder = opts.placeholder||'0';
inp.addEventListener('input', function(){
var v = parseFloat(inp.value); if(isNaN(v)) v=0;
getSet.set(v); saveState();
if(opts.onChange) opts.onChange();
});
if(opts.rerender) inp.addEventListener('change', function(){ render(); });
return inp;
}
function bindMoneyNum(getSet, opts){
var wrap = document.createElement('span');
wrap.className = 'money-cell';
wrap.appendChild(bindNum(getSet, opts));
return wrap;
}
function bindPctInput(getSet, opts){
opts = opts||{};
var inp = document.createElement('input');
inp.type='number'; inp.step='0.1';
inp.value = (getSet.get()*100).toFixed(opts.dec===undefined?1:opts.dec);
inp.addEventListener('input', function(){
var v = parseFloat(inp.value); if(isNaN(v)) v=0;
getSet.set(v/100); saveState();
});
if(opts.rerender) inp.addEventListener('change', function(){ render(); });
return inp;
}
function bindEditableText(getSet, opts){
opts = opts||{};
var inp = document.createElement('input');
inp.type='text';
inp.value = getSet.get();
inp.className = opts.cls||'';
inp.addEventListener('input', function(){ getSet.set(inp.value); saveState(); });
inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ inp.blur(); } });
if(opts.rerender){
inp.addEventListener('change', function(){ render(); });
}
return inp;
}

var box = document.createElement('div'); box.className = 'modal-box';

box.appendChild(inp);
var btnRow = el('div','modal-btns');

var okBtn = el('button','btn','OK');
btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
box.appendChild(btnRow);
overlay.appendChild(box);
document.body.appendChild(overlay);
setTimeout(function(){ inp.focus(); inp.select(); }, 30);
function ok(){ var v=inp.value.trim(); closeAppModal(); if(v!=='') onOk(v); }
okBtn.onclick = ok;
cancelBtn.onclick = closeAppModal;
inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); ok(); } if(ev.key==='Escape') closeAppModal(); });
overlay.addEventListener('click', function(ev){ if(ev.target===overlay) closeAppModal(); });
}

closeAppModal();
opts = opts||{};
var overlay = document.createElement('div');
overlay.id='appModalOverlay'; overlay.className='modal-overlay';
var box = document.createElement('div'); box.className='modal-box';
box.appendChild(el('p','modal-msg',message));

var yesBtn = el('button','btn '+(opts.danger===false?'':'danger'), opts.okLabel||'Conferma');
btnRow.appendChild(noBtn); btnRow.appendChild(yesBtn);
box.appendChild(btnRow);
overlay.appendChild(box);

yesBtn.onclick = function(){ closeAppModal(); onYes(); };
noBtn.onclick = closeAppModal;

}

};
reader.readAsText(f);
});
