<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Smile — Controllo di gestione · Bilancio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://appgestione.it/fonts/tosmile.css?f=poppins:500,600,700,800|nunito-sans:400,600,700" rel="stylesheet">
<style>
/* Stessi colori e caratteri della Gestione finanziaria */
:root{
  --navy:#3B2647; --navy-2:#5A3D68; --teal:#2F8F9E; --teal-light:#e6f4f5; --amber:#D4A017; --yellow:#F1E44D;
  --purple:#A36EA6; --purple-light:#f3ecf4; --red:#c0483f; --green:#3f8f5c; --bg:#f6f5f3; --card:#ffffff;
  --border:#e2dde3; --text:#241a29; --text-soft:#655a6b; --radius:10px;
  --mono:'SF Mono','Consolas',monospace; --font-brand:'Poppins',sans-serif;
  --font-body:'Nunito Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text)}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{display:flex;min-height:100vh}
/* barra laterale */
#sidebar{width:236px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#sidebar .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.14);text-align:center}
#sidebar .brand img{max-width:150px;width:100%;height:auto;display:block;margin:0 auto 8px;background:#fff;border-radius:10px;padding:8px 10px}
#sidebar .brand span{display:block;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow);margin-top:2px;font-family:var(--font-brand)}
#sidebar .az{padding:12px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--yellow);font-weight:700;font-family:var(--font-brand)}
#sidebar .azn{padding:0 18px 10px;font-size:13px;color:#e8dcec;font-weight:600}
#sidebar nav{flex:1;padding:6px 0}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#d9cbdd;padding:11px 18px;font-size:13.8px;cursor:pointer;border-left:3px solid transparent;font-family:var(--font-brand);font-weight:500}
.navbtn:hover{background:rgba(255,255,255,.07)}
.navbtn.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--yellow);font-weight:700}
.navbtn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn .nb{margin-left:auto;background:var(--yellow);color:#3a3816;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
#sidebar .foot{padding:10px 18px 16px;font-size:11.5px;color:#cbb9d0;line-height:1.5}
#sidebar .foot a{color:#fff}
/* contenuto */
#main{flex:1;min-width:0;padding:26px 32px 70px;max-width:1440px}
h1.pagetitle{font-family:var(--font-brand);font-weight:700;font-size:22px;margin:0 0 3px;color:var(--navy)}
p.pagesub{margin:0 0 20px;color:var(--text-soft);font-size:13.5px;max-width:90ch}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.card h2{font-family:var(--font-brand);font-weight:700;font-size:14px;margin:0 0 12px;color:var(--teal);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--navy);min-height:38px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;min-height:30px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--text-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12.8px;color:var(--text-soft);font-weight:700;font-family:var(--font-brand)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{background:var(--yellow);color:#3a3816;border-radius:999px;padding:0 6px;margin-left:4px;font-size:11px}
.msg{border-radius:10px;padding:11px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.msg.warn{background:#fdf3d8;color:#7a5a06}
.msg.ok{background:#e3f2e8;color:#2c6b43}
.msg.err{background:#f8e1df;color:#9a3128}
.msg.info{background:var(--teal-light);color:#1f6873}
.msg b{font-weight:800}
/* cruscotto KPI */
.cru-grid{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.cru{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;overflow:hidden}
.cru::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--teal))}
.cru .l{font-size:12px;font-weight:800;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em}
.cru .v{font-family:var(--font-brand);font-size:25px;font-weight:700;color:var(--navy);line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.cru .v.pos{color:var(--green)} .cru .v.neg{color:var(--red)}
.cru .s{font-size:12.5px;color:var(--text-soft);line-height:1.45}
.cru .s b{color:var(--navy)}
.cru .d{display:inline-flex;align-items:center;gap:3px;font-weight:800;border-radius:999px;padding:1px 8px;font-size:11.5px;white-space:nowrap}
.d.good{background:#e3f2e8;color:#2c6b43}.d.bad{background:#f8e1df;color:#9a3128}.d.flat{background:#efedf0;color:var(--text-soft)}
.cru.big{grid-column:span 2}
.meter{height:9px;border-radius:99px;background:#eeeaef;overflow:visible;margin:8px 0 4px;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--teal))}
.meter b{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--navy)}
.meter em{position:absolute;top:13px;font-style:normal;font-size:11px;font-weight:800;color:var(--navy);transform:translateX(-50%);white-space:nowrap}
.scen{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.scen .when{font-size:12.5px;color:var(--text-soft);background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 12px}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.chartbox{position:relative;height:320px}
@media (max-width:1150px){.cru-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.charts{grid-template-columns:1fr}}
@media (max-width:520px){.cru-grid{grid-template-columns:1fr}.cru.big{grid-column:auto}}
/* tabelle */
.table-scroll{overflow:auto;max-width:100%;max-height:72vh;border:1px solid var(--border);border-radius:12px}
table.dt{width:100%;border-collapse:collapse;font-size:12.8px}
table.dt th{text-align:right;padding:8px 9px;background:var(--teal-light);color:var(--teal);font-weight:700;font-size:11.2px;text-transform:uppercase;letter-spacing:.02em;position:sticky;top:0;z-index:3;font-family:var(--font-brand);white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:2}
table.dt th:first-child{background:var(--teal-light);z-index:4}
table.dt td{padding:6px 9px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.dt td.l,table.dt th.l{text-align:left}
table.dt td.c,table.dt th.c{text-align:center}
table.dt tr.area td{background:var(--purple-light);font-weight:800;color:var(--navy);font-family:var(--font-brand);padding-top:9px}
table.dt tr.area td:first-child{background:var(--purple-light)}
table.dt tr.tot td{background:#eaf6f4;font-weight:800;border-top:2px solid var(--teal)}
table.dt tr.tot td:first-child{background:#eaf6f4}
table.dt tr.key td{background:var(--navy);color:#fff;font-weight:800;font-family:var(--font-brand)}
table.dt tr.key td:first-child{background:var(--navy)}
table.dt tr.nuova td{background:#fffbe6}
table.dt tr.nuova td:first-child{background:#fffbe6}
table.dt .vd{display:block;max-width:300px;overflow:hidden;text-overflow:ellipsis}
table.dt .cod{font-family:var(--mono);font-size:11px;color:var(--text-soft)}
table.dt input{width:100px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;text-align:right;font-size:12.5px;font-family:var(--mono)}
table.dt select{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:12.3px;max-width:220px;background:#fff}
table.dt input:focus,table.dt select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.neg{color:var(--red)}.pos{color:var(--green)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;letter-spacing:.02em;vertical-align:middle}
.tag.new{background:var(--yellow);color:#3a3816}
.tag.f{background:#e8e1f0;color:#5a3d68}.tag.v{background:#dff0f2;color:#1f6873}.tag.x{background:#efedf0;color:#655a6b}
.fv{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.fv button{border:0;background:#fff;padding:4px 10px;font-weight:800;font-size:12px;cursor:pointer;color:var(--text-soft)}
.fv button.on.F{background:var(--navy-2);color:#fff}.fv button.on.V{background:var(--teal);color:#fff}
.fv button:disabled{cursor:default}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--text-soft)}
.field input,.field select{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:14px;min-height:40px;background:#fff;color:var(--text);font-weight:600}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.drop{border:2px dashed color-mix(in srgb,var(--teal) 45%,var(--border));border-radius:14px;padding:22px;text-align:center;background:color-mix(in srgb,var(--teal-light) 55%,#fff);cursor:pointer;transition:background .15s}
.drop:hover,.drop.over{background:var(--teal-light)}
.drop b{font-family:var(--font-brand);color:var(--navy);font-size:15px;display:block;margin-bottom:4px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.step{border:1px solid var(--border);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:6px}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--purple-light);color:var(--navy);font-weight:800;font-family:var(--font-brand)}
.step.ok .n{background:var(--green);color:#fff}
.step b{font-family:var(--font-brand);color:var(--navy)}
.step p{margin:0;font-size:12.8px;color:var(--text-soft)}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.formula{font-family:var(--mono);font-size:12.5px;background:#faf8fb;border:1px solid var(--border);border-radius:9px;padding:10px 12px;line-height:1.7;overflow-x:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:92vw}
.gate{max-width:520px;margin:12vh auto;background:#fff;border:1px solid var(--border);border-radius:18px;padding:28px;text-align:center}
.gate img{width:170px;margin-bottom:10px}
.gate h1{font-family:var(--font-brand);color:var(--navy);font-size:21px;margin:6px 0}
.saving{font-size:12px;color:var(--text-soft)}
.ricl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-soft);margin:6px 0 12px}
@media (max-width:900px){
  #app{flex-direction:column}
  #sidebar{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;overflow-x:auto}
  #sidebar .brand,#sidebar .az,#sidebar .azn,#sidebar .foot{display:none}
  #sidebar nav{display:flex;padding:0}
  .navbtn{border-left:0;border-bottom:3px solid transparent;padding:13px 14px;white-space:nowrap}
  .navbtn.active{border-bottom-color:var(--yellow)}
  #main{padding:18px 14px 60px}
}
@media print{#sidebar,.noprint,.btn{display:none!important}#main{padding:0}.card,.cru{break-inside:avoid}.table-scroll{max-height:none;overflow:visible}body{background:#fff}}
</style>
<!-- dopo una modifica la pagina resta dov'era (comune a tutte le app To Smile) -->
<script src="https://appgestione.it/static/resta-qui.js?v=1" defer></script>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="brand"><img src="https://appgestione.it/static/logo-tosmile.png" alt="To Smile"><span>Controllo di gestione · Bilancio</span></div>
    <div class="az">Azienda</div><div class="azn" id="azn"></div>
    <nav id="nav"></nav>

  </aside>
  <main id="main"></main>
</div>
<input type="file" id="pdfin" accept="application/pdf,.pdf" hidden>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {
  cruscotto: '<path d="M3 13a9 9 0 0 1 18 0"/><path d="M12 13l4-4"/><path d="M5 19h14"/>',
  budget: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',
  consuntivo: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13l2 2 4-4"/>',
  scostamenti: '<path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 5-6"/><path d="M15 7h4v4"/>',
  impostazioni: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  up: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 20h14"/>', print: '<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><rect x="6" y="14" width="12" height="7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- riclassificazione per aree del conto economico ---------- */
const AREE = [
  { k: 'ricavi', l: 'Ricavi delle prestazioni', lato: 'ricavo' },
  { k: 'rimIn', l: 'Rimanenze iniziali', lato: 'costo', natura: true },
  { k: 'acquisti', l: 'Acquisti di materiali e merci', lato: 'costo', natura: true },
  { k: 'rimFin', l: 'Rimanenze finali', lato: 'ricavo', natura: true },
  { k: 'produttivi', l: 'Costi produttivi', lato: 'costo', natura: true },
  { k: 'personale', l: 'Costo del personale', lato: 'costo', natura: true },
  { k: 'commerciali', l: 'Costi commerciali', lato: 'costo', natura: true },
  { k: 'amministrativi', l: 'Costi amministrativi e generali', lato: 'costo', natura: true },
  { k: 'tributari', l: 'Oneri tributari', lato: 'costo', natura: true },
  { k: 'ammortamenti', l: 'Ammortamenti', lato: 'costo', natura: true },
  { k: 'finanziari', l: 'Oneri finanziari', lato: 'costo', natura: true },
  { k: 'provFin', l: 'Proventi finanziari', lato: 'ricavo' },
  { k: 'altriRic', l: 'Altri ricavi e proventi (extra gestione)', lato: 'ricavo' },
  { k: 'extra', l: 'Costi extra gestione', lato: 'costo' },
  { k: 'imposte', l: 'Imposte sul reddito', lato: 'costo' },
];
const AREA = Object.fromEntries(AREE.map(a => [a.k, a]));
// proposta di area e di natura (fisso / variabile) per una voce nuova: l'utente può sempre cambiarle
function proponi(v) {
  const d = (v.descr || '').toUpperCase(), m = (v.codice || '').slice(0, 2), c5 = (v.codice || '').slice(0, 5);
  let area;
  if (v.lato === 'ricavo') {
    if (m === '58' || /RICAV|PRESTAZ|VENDIT/.test(d) && m < '64') area = 'ricavi';
    else if (m === '80' || /RIM\.?\s*FIN|RIMANENZE FIN/.test(d)) area = 'rimFin';
    else if (/INTERESS|PROVENTI FIN|DIVIDEND|CEDOL/.test(d)) area = 'provFin';
    else area = 'altriRic';
  } else {
    if (m === '80' || /ESISTENZE INIZ|RIM\.?\s*IN/.test(d)) area = 'rimIn';
    else if (m === '96' || /IRES|IRAP|IMPOSTE SUL REDDITO|IMPOSTE CORRENTI/.test(d) && m >= '90') area = 'imposte';
    else if (m === '88' || /INTERESSI PASSIV|ONERI FINANZ/.test(d)) area = 'finanziari';
    else if (m === '74' || m === '75' || /AMM\.?TO|AMMORTAM|Q\.T[EA] AM/.test(d)) area = 'ammortamenti';
    else if (m === '72') area = 'personale';
    else if (/COMP\.?\s*AMM|AMMINISTRATOR|CO\.CO\.CO|INPS AMM/.test(d)) area = 'personale';
    else if (c5 === '84/05' || /IMPOSTA DI|TASS[AE]|DIRITTI CAMERAL|BOLLO/.test(d) && m === '84') area = 'tributari';
    else if (m === '84') area = /SOPRAV|MULT|AMMEND|EROG|LIBERAL|OMAGG|ARROT|ABBUON/.test(d) ? 'extra' : 'amministrativi';
    else if (m === '66') area = /PUBBLICIT/.test(d) ? 'commerciali' : /CANCELLER|PULIZIA|INDUMENT/.test(d) ? 'amministrativi' : 'acquisti';
    else if (/PUBBLICIT|MARKETING|SPONSOR|COMMERCIAL|EVENTI|PROMOZ|OMAGG/.test(d)) area = 'commerciali';
    else if (/COMP\.?\s*PROF|MEDIC|LABORATOR|ODONTOTEC|PRODUTTIV|COMPENSI (LAV|OCCAS)|LEASING|TECNICHE/.test(d)) area = 'produttivi';
    else area = 'amministrativi';
  }
  let natura = '';
  if (AREA[area].natura) {
    natura = ['acquisti', 'rimIn', 'rimFin'].includes(area) || /COMP\.?\s*PROF|COMPENSI MEDICI|MEDICI|LABORATOR|ODONTOTEC|PROVVIGION|COMMISSIONI/.test(d) ? 'V' : 'F';
  }
  return { area, natura };
}

/* ---------- stato ---------- */
let D = null, VER = 0, ME = {}, PAGE = 'cruscotto', SCEN = 'consuntivo', FILT = { r: 'tutte', q: '' }, CHARTS = [], PDF_PER = null, APERTA = null;
const vuoti = () => ({ voci: {}, base: null, budget: { anno: null, crescita: 0, inflazione: 0, righe: {} }, consuntivi: [], scelto: null, proiezione: 'misto' });

async function api(method, url, body, retry = true) {
  const opt = { method, credentials: 'same-origin', headers: {} };
  if (body instanceof FormData) opt.body = body; else if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && retry && await rientra()) return api(method, url, body, false);
  if (!r.ok) { const e = new Error(j.error || 'Operazione non riuscita'); e.status = r.status; e.data = j; throw e; }
  return j;
}
// la sessione dell'app scade dopo un po' di inattività: si rientra da soli con l'accesso unico
async function rientra() {
  try {
    const a = await (await fetch('/api/bilancio/accesso', { credentials: 'same-origin' })).json();
    if (a.stato !== 'ok') return false;

/* ---------- numeri ---------- */
const nf0 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const eur = v => (v < 0 ? '−' : '') + nf0.format(Math.abs(Math.round(v || 0))) + ' €';
const eurS = v => { const a = Math.abs(v || 0); return (v < 0 ? '−' : '') + (a >= 1e6 ? nf1.format(a / 1e6).replace(/,0$/, '') + ' mln €' : a >= 1e4 ? nf0.format(a / 1e3) + 'k €' : nf0.format(a) + ' €'); };
const pct = v => isFinite(v) ? nf1.format(v * 100) + '%' : '—';
const num = s => { const t = String(s ?? '').trim().replace(/\s|€|%/g, ''); if (!t) return 0; const n = Number(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t); return isFinite(n) ? n : 0; };
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const dIt = iso => { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${+d} ${MESI[+m - 1]} ${y}`; };
const giorniAnno = y => ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
const frazione = (dal, al) => { const y = +al.slice(0, 4); const g = (Date.parse(al) - Date.parse(dal)) / 864e5 + 1; return Math.min(1, Math.max(0.01, g / giorniAnno(y))); };
const dataDaFrazione = (anno, f) => { const d = new Date(Date.UTC(anno, 0, 1)); d.setUTCDate(d.getUTCDate() + Math.round(f * giorniAnno(anno)) - 1); return d.toISOString().slice(0, 10); };

/* ---------- valori: base, budget, consuntivo, proiezione ---------- */
const voci = () => Object.values(D.voci);
const base = id => D.base?.valori?.[id] || 0;
function consScelto() {
  const l = [...D.consuntivi].sort((a, b) => a.al.localeCompare(b.al));
  return l.find(c => c.id === D.scelto) || l.filter(c => +c.anno === +D.budget.anno).pop() || l.pop() || null;
}
const valCons = (c, id) => c?.valori?.[id] || 0;
// budget di ogni voce: i ricavi crescono della % scelta, i costi variabili restano in proporzione al fatturato, i fissi crescono dell'inflazione
function calcolaBudget() {
  const b = D.budget, out = {}, cr = (+b.crescita || 0) / 100, inf = (+b.inflazione || 0) / 100;
  const riga = id => b.righe[id] || { metodo: 'auto' };
  const unaVoce = (v, fattB, fattBase) => {
    const r = riga(v.id), x = base(v.id);
    switch (r.metodo) {
      case 'uguale': return x;
      case 'perc': return x * (1 + (+r.valore || 0) / 100);
      case 'importo': return +r.valore || 0;
      case 'zero': return 0;
      case 'incidenza': return fattB * (+r.valore || 0) / 100;
    }
    if (v.nuova && !(v.id in b.righe)) return 0;
    if (v.area === 'ricavi') return x * (1 + cr);
    if (v.natura === 'V') return fattBase ? x * fattB / fattBase : x;
    if (v.natura === 'F') return x * (1 + inf);
    return x;
  };
  const vs = voci(), fattBase = vs.filter(v => v.area === 'ricavi').reduce((s, v) => s + base(v.id), 0);
  let fattB = 0;
  for (const v of vs.filter(v => v.area === 'ricavi')) { out[v.id] = unaVoce(v, 0, fattBase); fattB += out[v.id]; }
  for (const v of vs.filter(v => v.area !== 'ricavi')) out[v.id] = unaVoce(v, fattB, fattBase);
  return out;
}
// proiezione a fine anno dal consuntivo: andamento (in proporzione al tempo), budget restante, oppure misto
function calcolaProiezione(c, bud) {
  const out = {}; if (!c) return out;
  const f = frazione(c.dal, c.al), modo = D.proiezione || 'misto';
  for (const v of voci()) {
    const x = valCons(c, v.id), b = bud[v.id] || 0;
    if (f >= 0.999 || v.area === 'rimIn' || v.area === 'rimFin') { out[v.id] = x; continue; } // le rimanenze sono giacenze: restano quelle
    const andamento = x / f, resto = x + b * (1 - f);
    if (modo === 'andamento') out[v.id] = andamento;
    else if (modo === 'budget') out[v.id] = resto;
    else out[v.id] = (v.area === 'ricavi' || v.natura === 'V' || !b) ? andamento : resto;
  }
  return out;
}
// conto economico riclassificato e indicatori da una serie di valori { id: importo }
function calcola(val, periodo) {
  const A = Object.fromEntries(AREE.map(a => [a.k, 0]));
  let fissi = 0, variabili = 0, nonClass = 0, nonClassN = 0;
  for (const v of voci()) {
    const x = val[v.id] || 0; if (!x) continue;
    A[v.area] = (A[v.area] || 0) + x;
    const ar = AREA[v.area]; if (!ar?.natura) continue;
    const segno = v.area === 'rimFin' ? -1 : 1;
    if (v.natura === 'V') variabili += segno * x;
    else { fissi += segno * x; if (v.natura !== 'F') { nonClass += x; nonClassN++; } }
  }
  const fatt = A.ricavi, materie = A.rimIn + A.acquisti - A.rimFin;
  const ebitda = fatt - (materie + A.produttivi + A.personale + A.commerciali + A.amministrativi + A.tributari);
  const ebit = ebitda - A.ammortamenti;
  const gestione = ebit - A.finanziari + A.provFin;
  const ante = gestione + A.altriRic - A.extra;
  const utile = ante - A.imposte;
  const mdc = fatt - variabili, mdcPct = fatt ? mdc / fatt : 0;
  const bep = mdcPct > 0 ? fissi / mdcPct : Infinity, bepPct = fatt ? bep / fatt : Infinity;
  const anno = periodo?.anno || +D.budget.anno || new Date().getFullYear();
  return { A, fatt, materie, ebitda, ebit, gestione, ante, utile, fissi, variabili, mdc, mdcPct, bep, bepPct, nonClass, nonClassN,
    dataBep: isFinite(bepPct) && bepPct <= 1 ? dataDaFrazione(anno, bepPct) : null, anno, periodo };
}
// i tre scenari usati in tutte le pagine
function scenari() {
  const bud = calcolaBudget(), c = consScelto();
  const anno = +D.budget.anno || (D.base ? +D.base.anno + 1 : new Date().getFullYear());
  const out = { bud, c, anno,
    base: D.base ? calcola(D.base.valori, { anno: +D.base.anno, dal: D.base.dal, al: D.base.al, f: frazione(D.base.dal, D.base.al) }) : null,
    budget: calcola(bud, { anno, f: 1 }) };
  if (c) {
    out.f = frazione(c.dal, c.al);
    out.cons = calcola(c.valori, { anno: +c.anno, dal: c.dal, al: c.al, f: out.f });
    out.proVal = calcolaProiezione(c, bud);
    out.pro = calcola(out.proVal, { anno: +c.anno, f: 1 });
    const budAl = Object.fromEntries(Object.entries(bud).map(([k, x]) => [k, ['rimIn', 'rimFin'].includes(D.voci[k]?.area) ? x : x * out.f]));
    out.budAlVal = budAl; out.budAl = calcola(budAl, { anno, f: out.f });
  }
  return out;
}

/* ---------- pannello KPI (uguale in Cruscotto, Budget, Consuntivo, Scostamenti) ---------- */
function delta(a, b, buonoSeSale = true) {
  if (b == null || !isFinite(a) || !isFinite(b) || !b) return '';
  const d = (a - b) / Math.abs(b), good = buonoSeSale ? d >= 0 : d <= 0;
  return ` <span class="d ${Math.abs(d) < 0.005 ? 'flat' : good ? 'good' : 'bad'}">${d >= 0 ? '▲' : '▼'} ${nf1.format(Math.abs(d * 100))}%</span>`;
}
function kpi(k, cfr, cfrNome) {

  const margine = isFinite(k.bepPct) ? 1 - k.bepPct : null;
  const fBar = isFinite(k.bep) ? Math.min(100, k.fatt / Math.max(k.fatt, k.bep) * 100) : 0, bBar = isFinite(k.bep) ? Math.min(100, k.bep / Math.max(k.fatt, k.bep) * 100) : 100;
  const cf = cfr ? `<span class="muted"> vs ${esc(cfrNome)}</span>` : '';
  return `<div class="cru-grid">
    <div class="cru" style="--c:var(--teal)"><span class="l">Fatturato</span><span class="v">${eur(k.fatt)}</span><span class="s">${cfr ? delta(k.fatt, cfr.fatt) + cf : 'ricavi delle prestazioni'}</span></div>
    <div class="cru" style="--c:var(--navy-2)"><span class="l">Costi fissi</span><span class="v">${eur(k.fissi)}</span><span class="s">incidenza <b>${pct(inc(k.fissi))}</b> sul fatturato${cfr ? delta(k.fissi, cfr.fissi, false) : ''}${k.nonClassN ? `<br><span class="neg">${k.nonClassN} voci non classificate (contate come fisse)</span>` : ''}</span></div>
    <div class="cru" style="--c:var(--purple)"><span class="l">Costi variabili</span><span class="v">${eur(k.variabili)}</span><span class="s">incidenza <b>${pct(inc(k.variabili))}</b> sul fatturato${cfr ? delta(k.variabili, cfr.variabili, false) : ''}</span></div>
    <div class="cru" style="--c:#7fb6bf"><span class="l">Margine di contribuzione</span><span class="v">${eur(k.mdc)}</span><span class="s"><b>${pct(k.mdcPct)}</b> del fatturato: quanto resta di ogni € incassato per coprire i fissi</span></div>
    <div class="cru big" style="--c:var(--amber)"><span class="l">Break even point</span><span class="v">${isFinite(k.bep) ? eur(k.bep) : '—'}</span><span class="s">${bepTxt}</span>
      ${isFinite(k.bep) ? `<div class="meter" aria-hidden="true"><i style="width:${fBar}%"></i><b style="left:calc(${bBar}% - 1px)"></b><em style="left:${bBar}%">pareggio</em></div><span class="s" style="margin-top:12px">${margine != null && margine > 0 ? `Margine di sicurezza <b>${pct(margine)}</b>: il fatturato può scendere di ${eur(k.fatt - k.bep)} prima di andare in perdita` : 'Fatturato sotto il pareggio'}</span>` : ''}</div>
    <div class="cru" style="--c:var(--green)"><span class="l">EBITDA</span><span class="v ${k.ebitda < 0 ? 'neg' : ''}">${eur(k.ebitda)}</span><span class="s"><b>${pct(inc(k.ebitda))}</b> del fatturato${cfr ? delta(k.ebitda, cfr.ebitda) : ''}<br>EBIT ${eur(k.ebit)}</span></div>

  return `<h1 class="pagetitle">Cruscotto KPI</h1><p class="pagesub">I numeri chiave del controllo di gestione: costi fissi e variabili, break even point, EBITDA e utile. Scegli se guardare il consuntivo, il budget o la proiezione a fine anno.</p>

      <input class="field" style="flex:1 1 220px;max-width:320px;border:1px solid var(--border);border-radius:9px;padding:8px 10px;min-height:38px" type="search" placeholder="Cerca voce o codice" data-cerca value="${esc(FILT.q)}"></div>
    <div class="table-scroll"><table class="dt"><thead><tr><th>Voce</th><th>${b.anno}</th><th>% fatt.</th><th class="l">Area</th><th class="c">Natura</th></tr></thead><tbody>
    ${lista.map(v => `<tr class="${v.nuova ? 'nuova' : ''}"><td><span class="vd" title="${esc(v.mastro || '')}">${v.nuova ? '<span class="tag new">NUOVA</span> ' : ''}${esc(v.descr)}</span><span class="cod">${esc(v.codice)} · ${esc(v.mastro || '')}</span></td>
      <td>${eur(base(v.id))}</td><td class="muted">${S.base.fatt ? pct(base(v.id) / S.base.fatt) : ''}</td><td class="l">${selArea(v)}</td><td class="c">${fvSel(v)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nessuna voce</td></tr>'}
    </tbody></table></div></div>
  <div class="card"><h2>Come calcolo gli indicatori</h2><div class="formula">
    Costo materie = rimanenze iniziali + acquisti − rimanenze finali<br>
    EBITDA (MOL) = fatturato − (materie + produttivi + personale + commerciali + amministrativi + oneri tributari)<br>
    EBIT = EBITDA − ammortamenti · Risultato della gestione = EBIT − oneri finanziari + proventi finanziari<br>
    Utile = risultato della gestione + altri ricavi − costi extra − imposte<br>
    Costi fissi / variabili = somma delle voci classificate (extra gestione e imposte escluse)<br>
    Margine di contribuzione % = 1 − costi variabili / fatturato<br>
    Break even point = costi fissi / margine di contribuzione % · Data di pareggio = 1 gennaio + (BEP / fatturato) × giorni dell'anno</div></div>` : ''}`;
}

/* ---------- grafici ---------- */
function disegnaGrafici(S) {
  if (PAGE !== 'cruscotto' || !window.Chart) return;
  const k = { consuntivo: S.cons, budget: S.budget, proiezione: S.pro }[SCEN]; if (!k) return;
  Chart.defaults.font.family = "'Nunito Sans', sans-serif"; Chart.defaults.color = '#655a6b';
  const cb = $('#chBep');
  if (cb && k.fatt > 0) {
    const max = Math.max(k.fatt, isFinite(k.bep) ? k.bep : 0) * 1.25, vp = k.variabili / k.fatt;
    const pts = n => Array.from({ length: 21 }, (_, i) => ({ x: max * i / 20, y: n(max * i / 20) }));
    const ds = [
      { label: 'Ricavi', data: pts(x => x), borderColor: '#2F8F9E', borderWidth: 3, pointRadius: 0 },
      { label: 'Costi totali', data: pts(x => k.fissi + vp * x), borderColor: '#c0483f', borderWidth: 3, pointRadius: 0 },
      { label: 'Costi fissi', data: pts(() => k.fissi), borderColor: '#5A3D68', borderDash: [6, 5], borderWidth: 2, pointRadius: 0 },
    ];
    if (isFinite(k.bep)) ds.push({ label: 'Pareggio', data: [{ x: k.bep, y: k.bep }], pointRadius: 8, pointBackgroundColor: '#D4A017', pointBorderColor: '#fff', pointBorderWidth: 2, showLine: false, borderColor: '#D4A017' });
    ds.push({ label: 'Fatturato attuale', data: [{ x: k.fatt, y: 0 }, { x: k.fatt, y: Math.max(k.fatt, k.fissi + vp * k.fatt) }], borderColor: 'rgba(36,26,41,.35)', borderWidth: 1.5, borderDash: [3, 4], pointRadius: 0 });
    CHARTS.push(new Chart(cb, { type: 'scatter', data: { datasets: ds.map(d => ({ showLine: true, fill: false, tension: 0, ...d })) },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 500 },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true } }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${eurS(c.parsed.y)} (fatturato ${eurS(c.parsed.x)})` } } },
        scales: { x: { type: 'linear', min: 0, max, title: { display: true, text: 'Fatturato' }, ticks: { callback: v => eurS(v) }, grid: { color: '#f0edf1' } },
          y: { min: 0, ticks: { callback: v => eurS(v) }, grid: { color: '#f0edf1' } } } } }));
  }
  const cc = $('#chCascata');
  if (cc) {
    const passi = [['Fatturato', k.fatt, 't'], ['Materie', -k.materie], ['Produttivi', -k.A.produttivi], ['Personale', -k.A.personale], ['Commerciali', -k.A.commerciali],
      ['Amministrativi', -k.A.amministrativi], ['Tributari', -k.A.tributari], ['EBITDA', k.ebitda, 't'], ['Ammortamenti', -k.A.ammortamenti],
      ['Finanziari', -k.A.finanziari + k.A.provFin], ['Extra', k.A.altriRic - k.A.extra], ['Imposte', -k.A.imposte], ['Utile', k.utile, 't']];
    let cur = 0; const data = [], col = [];
    for (const [l, v, t] of passi) {
      if (t) { data.push([0, v]); cur = v; col.push(l === 'Fatturato' ? '#2F8F9E' : v >= 0 ? '#3f8f5c' : '#c0483f'); }
      else { data.push([cur, cur + v]); cur += v; col.push(v >= 0 ? '#7fb6bf' : '#d9a39c'); }
    }
    CHARTS.push(new Chart(cc, { type: 'bar', data: { labels: passi.map(p => p[0]), datasets: [{ data, backgroundColor: col, borderRadius: 5, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 500 }, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => { const p = passi[c.dataIndex]; return `${p[0]}: ${eur(p[1])}${k.fatt ? ' (' + pct(p[1] / k.fatt) + ')' : ''}`; } } } },
        scales: { y: { ticks: { callback: v => eurS(v) }, grid: { color: '#f0edf1' } }, x: { grid: { display: false }, ticks: { maxRotation: 50, autoSkip: false, font: { size: 11 } } } } } }));
  }
}

/* ---------- caricamento dei PDF ---------- */
async function leggiPdf(file, cosa) {
  if (!file) return;
  toast('Leggo il bilancio…', 20000);
  const fd = new FormData(); fd.append('pdf', file);
  let r; try { r = await api('POST', '/api/bilancio/leggi', fd); } catch (e) { return toast(e.message, 7000); }
  const oggi = new Date().toISOString().slice(0, 10), anno = +r.al.slice(0, 4);
  const valori = {}; for (const x of r.voci) valori[x.id] = x.saldo;
  const controllo = r.controllo;
  if (cosa === 'base') {
    if (D.base && !confirm(`Sostituire il bilancio di riferimento ${D.base.anno} con quello ${anno}? Le classificazioni delle voci restano.`)) return toast('Nessuna modifica.');
    let nuove = 0;
    for (const x of r.voci) {
      const v = D.voci[x.id];
      if (v) Object.assign(v, { descr: x.descr, mastro: x.mastro, conto: x.conto });
      else { const p = proponi(x); D.voci[x.id] = { id: x.id, codice: x.codice, descr: x.descr, lato: x.lato, mastro: x.mastro, conto: x.conto, area: p.area, natura: p.natura, proposta: true }; nuove++; }
      if (D.voci[x.id].nuova) D.voci[x.id].nuova = false;
    }
    D.base = { anno, dal: r.dal, al: r.al, ditta: r.ditta, file: r.file, caricatoIl: oggi, caricatoDa: ME.utente, valori, controllo };
    if (!D.budget.anno || +D.budget.anno <= anno) D.budget.anno = anno + 1;
    salva(true); render();
    toast(`${r.voci.length} voci lette · utile ${eur(controllo.utile)}${controllo.ok ? ' ✓' : ' (non quadra: controlla)'}${nuove ? ` · ${nuove} classificate in automatico: controllale` : ''}`, 7000);
    return;
  }
  // consuntivo: le voci che non ci sono ancora diventano "nuove" (da aggiungere al budget)
  const esiste = D.consuntivi.find(c => c.al === r.al);
  if (esiste && !confirm(`C'è già un consuntivo al ${dIt(r.al)}: lo sostituisco con questo?`)) return toast('Nessuna modifica.');
  const nuoveIds = [];
  for (const x of r.voci) {
    if (D.voci[x.id]) { Object.assign(D.voci[x.id], { descr: x.descr, mastro: x.mastro || D.voci[x.id].mastro }); continue; }
    const p = proponi(x);
    D.voci[x.id] = { id: x.id, codice: x.codice, descr: x.descr, lato: x.lato, mastro: x.mastro, conto: x.conto, area: p.area, natura: p.natura, nuova: true, proposta: true };
    nuoveIds.push(x.id);
  }
  const c = { id: esiste?.id || 'c' + Date.now().toString(36), anno, dal: r.dal && r.dal.slice(0, 4) === r.al.slice(0, 4) ? r.dal : anno + '-01-01', al: r.al, file: r.file, caricatoIl: oggi, caricatoDa: ME.utente, valori, controllo, nuove: nuoveIds };
  D.consuntivi = D.consuntivi.filter(x => x.al !== r.al).concat(c);
  D.scelto = c.id;
  if (!D.budget.anno) D.budget.anno = anno;
  salva(true); PAGE = 'consuntivo'; render();
  toast(`Consuntivo al ${dIt(r.al)}: ${r.voci.length} voci${nuoveIds.length ? `, ${nuoveIds.length} nuove da aggiungere al budget` : ', nessuna voce nuova'}${controllo.ok ? '' : ' · ⚠ non quadra con il PDF'}`, 7000);
}

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-carica]'); if (!t) return;
  const d = t.dataset;
  if (d.pag) { PAGE = d.pag; window.scrollTo(0, 0); return render(); }
  if (d.scen) { SCEN = d.scen; return render(); }
  if (d.carica) { PDF_PER = d.carica; $('#pdfin').value = ''; return $('#pdfin').click(); }
  if (t.hasAttribute('data-print')) return window.print();
  if (d.cons) { D.scelto = d.cons; salva(); return render(); }
  if (d.filt) { FILT.r = d.filt; return render(); }
  if (!ME.admin) return;
  if (d.nat) { const v = D.voci[d.nat]; v.natura = v.natura === d.v ? '' : d.v; v.proposta = false; salva(); return render(); }
  if (d.proi) { D.proiezione = d.proi; salva(); return render(); }
  if (d.delCons) { if (!confirm('Togliere questo consuntivo? Le voci restano.')) return; D.consuntivi = D.consuntivi.filter(c => c.id !== d.delCons); if (D.scelto === d.delCons) D.scelto = null; salva(); return render(); }
  if (t.hasAttribute('data-proponi')) { for (const v of voci()) if (AREA[v.area]?.natura && !v.natura) v.natura = proponi(v).natura || 'F'; salva(); toast('Proposte applicate: controllale.'); return render(); }
  const aggiungi = id => { const v = D.voci[id]; const inp = document.querySelector(`[data-nuova-b="${CSS.escape(id)}"]`); D.budget.righe[id] = { metodo: 'importo', valore: num(inp?.value) }; v.nuova = false; };
  if (d.aggiungi) { aggiungi(d.aggiungi); salva(); toast('Aggiunta al budget.'); return render(); }
  if (t.hasAttribute('data-aggiungi-tutte')) { voci().filter(v => v.nuova).forEach(v => aggiungi(v.id)); salva(); toast('Voci aggiunte al budget.'); return render(); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-carica]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (t.id === 'pdfin') return leggiPdf(t.files[0], PDF_PER);
  if (!ME.admin) return;
  if (d.area) { const v = D.voci[d.area]; v.area = t.value; if (AREA[v.area].natura && !v.natura) v.natura = proponi(v).natura; if (!AREA[v.area].natura) v.natura = ''; v.proposta = false; salva(); return setTimeout(render); }
  if (d.bm) { // valore di partenza sensato per il metodo scelto
    const S = scenari(), r = { metodo: t.value };
    if (r.metodo === 'importo') r.valore = Math.round(S.bud[d.bm] || base(d.bm));
    if (r.metodo === 'perc') r.valore = 0;
    if (r.metodo === 'incidenza') r.valore = S.base.fatt ? Math.round(base(d.bm) / S.base.fatt * 1000) / 10 : 0;
    if (r.metodo === 'auto') delete D.budget.righe[d.bm]; else D.budget.righe[d.bm] = r;
    salva(); return setTimeout(render); }
  if (d.bv) { const r = D.budget.righe[d.bv] || { metodo: 'importo' }; r.valore = num(t.value); D.budget.righe[d.bv] = r; salva(); return setTimeout(render); }
  if (d.bp) { D.budget[d.bp] = d.bp === 'anno' ? +t.value || null : num(t.value); salva(); return setTimeout(render); }
});
let cercaT;
document.addEventListener('input', e => {
  if (e.target.matches('[data-cerca]')) { FILT.q = e.target.value; clearTimeout(cercaT); cercaT = setTimeout(() => { const p = e.target.selectionStart; render(); const n = $('[data-cerca]'); n.focus(); try { n.setSelectionRange(p, p); } catch {} }, 250); }
});
// trascina e rilascia il PDF sui riquadri di caricamento
document.addEventListener('dragover', e => { const z = e.target.closest?.('[data-carica]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('[data-carica]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest?.('[data-carica]'); if (!z) return; e.preventDefault(); z.classList.remove('over'); leggiPdf(e.dataTransfer.files[0], z.dataset.carica); });
window.addEventListener('beforeunload', e => { if (salvaT && ME.admin && inSalvataggio) { e.preventDefault(); } });

avvio();
</script>
