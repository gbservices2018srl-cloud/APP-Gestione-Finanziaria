<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pannello Master — To Smile</title>
<style>
:root{
  --navy:#3B2647; --teal:#2F8F9E; --yellow:#F1E44D; --purple:#A36EA6;
  --bg:#f6f5f3; --card:#fff; --border:#e2dde3; --text:#241a29; --text-soft:#655a6b;
  --red:#c0483f; --green:#3f8f5c;
  --font-brand:'Poppins',sans-serif; --font-body:'Nunito Sans',-apple-system,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0; font-family:var(--font-body); background:var(--bg); color:var(--text);}
.wrap{max-width:960px; margin:0 auto; padding:30px 20px 60px;}
header{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
header h1{font-family:var(--font-brand); font-size:20px; color:var(--navy); margin:0;}
header .tag{background:var(--navy); color:#fff; font-size:11px; padding:3px 10px; border-radius:20px; font-family:var(--font-brand); font-weight:700; letter-spacing:.03em;}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:22px 24px; margin-bottom:18px; box-shadow:0 4px 16px rgba(0,0,0,.03);}
.card h2{font-family:var(--font-brand); font-size:14px; margin:0 0 14px; color:var(--teal); text-transform:uppercase; letter-spacing:.04em;}
.input-row{display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.input-row label{min-width:130px; font-size:12.5px; color:var(--text-soft);}
input[type=text],input[type=password],input[type=number]{padding:8px 10px; border:1px solid var(--border); border-radius:7px; font-size:13px; width:220px;}
.btn{background:var(--teal); color:#fff; border:none; padding:9px 18px; border-radius:7px; font-size:13px; cursor:pointer; font-weight:700; font-family:var(--font-brand);}
.btn.secondary{background:#fff; color:var(--purple); border:1px solid var(--purple);}
.btn.danger{background:var(--red);}
.btn:hover{filter:brightness(1.07);}
.btn:disabled{opacity:.6; cursor:default;}
.btn-row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; padding:8px; background:#eef6f5; color:var(--navy); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;}
td{padding:8px; border-bottom:1px solid var(--border); vertical-align:middle;}
.notice{background:#fdf7e0; border:1px solid var(--yellow); border-radius:8px; padding:12px 16px; font-size:13px; color:#6b5c00; margin-bottom:16px;}
.notice.err{background:#fbe4e2; border-color:#e5b7b1; color:#7a2c22;}
.small-btn{font-size:11.5px; padding:4px 9px; border-radius:5px; border:1px solid var(--border); background:#fff; cursor:pointer; color:var(--teal); margin-right:4px;}
.small-btn.danger{color:var(--red);}
.auth-box{max-width:380px; margin:60px auto; background:#fff; border:1px solid var(--border); border-radius:14px; padding:32px; box-shadow:0 10px 30px rgba(0,0,0,.06);}
.auth-box h1{font-family:var(--font-brand); font-size:18px; color:var(--navy);}
pre.datajson{background:#1e2a30; color:#d7e6e4; padding:14px; border-radius:8px; font-size:11.5px; max-height:320px; overflow:auto; white-space:pre-wrap; word-break:break-word;}
.kpi-mini{display:inline-block; background:#eef6f5; border-radius:7px; padding:6px 12px; margin:3px 6px 3px 0; font-size:12.5px;}
.kpi-mini b{color:var(--navy);}
</style>
</head>
<body>
<div id="app"></div>
<script>

async function apiGet(p){ var r = await fetch(p,{credentials:'include'}); var d=null; try{d=await r.json();}catch(e){} return {ok:r.ok,data:d}; }
async function apiSend(p,m,b){ var r = await fetch(p,{method:m,credentials:'include',headers:{'Content-Type':'application/json'},body:b!==undefined?JSON.stringify(b):undefined}); var d=null; try{d=await r.json();}catch(e){} return {ok:r.ok,data:d}; }
var view = 'loading';
var companies = [];
var resetRequests = [];
var errMsg = '';
var viewingData = null;
function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
async function boot(){
var status = await apiGet('/api/admin/status');
if(!status.ok){ view='login'; errMsg='Impossibile contattare il server.'; render(); return; }
if(!status.data.configured){ view='setup'; render(); return; }
if(status.data.loggedIn){ await loadCompanies(); await loadResetRequests(); view='panel'; render(); return; }
view='login'; render();
}
async function loadCompanies(){
var r = await apiGet('/api/admin/companies');
if(r.ok) companies = r.data.companies || [];
}
async function loadResetRequests(){
var r = await apiGet('/api/admin/password-reset-requests');
if(r.ok) resetRequests = r.data.requests || [];
}
function render(){
var app = document.getElementById('app');
app.innerHTML = '';
var wrap = el('div','wrap');
var header = el('header',null,'<h1>Pannello Master</h1><span class="tag">To Smile</span>');
wrap.appendChild(header);
if(view==='setup') wrap.appendChild(renderSetup());
else if(view==='login') wrap.appendChild(renderLogin());
else if(view==='panel') wrap.appendChild(renderPanel());
app.appendChild(wrap);
}
function renderSetup(){
var box = el('div','auth-box');
box.appendChild(el('h1',null,'Imposta la password amministratore'));
box.appendChild(el('p',null,'Questa \u00e8 la prima attivazione: scegli la password che userai da qui in poi per accedere al pannello master. Fallo una sola volta.'));
if(errMsg) box.appendChild(el('div','notice err',errMsg));
var row = el('div','input-row');
row.appendChild(el('label',null,'Nuova password'));
var inp = document.createElement('input'); inp.type='password'; row.appendChild(inp);
box.appendChild(row);
var row2 = el('div','input-row');
row2.appendChild(el('label',null,'Conferma password'));
var inp2 = document.createElement('input'); inp2.type='password'; row2.appendChild(inp2);
box.appendChild(row2);
var btn = el('button','btn','Imposta password');
btn.onclick = async function(){
errMsg='';
if(inp.value.length<6){ errMsg='Almeno 6 caratteri.'; render(); return; }
if(inp.value!==inp2.value){ errMsg='Le due password non coincidono.'; render(); return; }
var r = await apiSend('/api/admin/setup','POST',{password:inp.value});
if(!r.ok){ errMsg=(r.data&&r.data.error)||'Errore.'; render(); return; }
await loadCompanies(); view='panel'; render();
};
box.appendChild(btn);
return box;
}
function renderLogin(){
var box = el('div','auth-box');
box.appendChild(el('h1',null,'Accesso master'));
if(errMsg) box.appendChild(el('div','notice err',errMsg));
var row = el('div','input-row');
row.appendChild(el('label',null,'Password'));
var inp = document.createElement('input'); inp.type='password'; row.appendChild(inp);
box.appendChild(row);
var btn = el('button','btn','Accedi');
async function doLogin(){
errMsg='';
var r = await apiSend('/api/admin/login','POST',{password:inp.value});
if(!r.ok){ errMsg=(r.data&&r.data.error)||'Password errata.'; render(); return; }
await loadCompanies(); view='panel'; render();
}
btn.onclick = doLogin;
inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); doLogin(); } });
box.appendChild(btn);
return box;
}
function renderPanel(){
var frag = el('div',null,'');
var logoutRow = el('div','btn-row');
var logoutBtn = el('button','btn secondary','Esci');
logoutBtn.onclick = async function(){ await apiSend('/api/admin/logout','POST'); view='login'; render(); };
logoutRow.appendChild(logoutBtn);
frag.appendChild(logoutRow);
var createCard = el('div','card');
createCard.appendChild(el('h2',null,'Crea nuova azienda'));
var nameRow = el('div','input-row');
nameRow.appendChild(el('label',null,'Nome azienda'));
var nameInp = document.createElement('input'); nameInp.type='text'; nameRow.appendChild(nameInp);
createCard.appendChild(nameRow);
var pwRow = el('div','input-row');
pwRow.appendChild(el('label',null,'Password iniziale'));
var pwInp = document.createElement('input'); pwInp.type='text'; pwInp.placeholder='almeno 4 caratteri'; pwRow.appendChild(pwInp);
createCard.appendChild(pwRow);
var emailRow = el('div','input-row');
emailRow.appendChild(el('label',null,'Email (facoltativa)'));
var emailInp = document.createElement('input'); emailInp.type='email'; emailInp.placeholder='per notifiche e reset password'; emailRow.appendChild(emailInp);
createCard.appendChild(emailRow);
if(errMsg) createCard.appendChild(el('div','notice err',errMsg));
var createBtn = el('button','btn','+ Crea azienda');
createBtn.onclick = async function(){
errMsg='';
var name = nameInp.value.trim(), pw = pwInp.value.trim(), email = emailInp.value.trim();
if(!name){ errMsg='Inserisci un nome.'; render(); return; }
if(pw.length<4){ errMsg='Password di almeno 4 caratteri.'; render(); return; }
var r = await apiSend('/api/admin/companies','POST',{name:name,password:pw,email:email||undefined});
if(!r.ok){ errMsg=(r.data&&r.data.error)||'Errore nella creazione.'; render(); return; }
await loadCompanies(); render();
};
createCard.appendChild(createBtn);
frag.appendChild(createCard);

if(resetRequests.length>0){
var reqCard = el('div','card');
reqCard.appendChild(el('h2',null,'Richieste di reset password ('+resetRequests.length+')'));
resetRequests.forEach(function(req){
var row = el('div','input-row');
row.appendChild(el('span',null,'<b>'+req.company_name.replace(/</g,'&lt;')+'</b> &mdash; richiesta il '+(req.requested_at||'').slice(0,16).replace('T',' ')));
var genBtn = el('button','small-btn','Genera nuova password');
genBtn.onclick = async function(){
var newPw = prompt('Nuova password per "'+req.company_name+'" (almeno 4 caratteri), da comunicare tu al cliente:');
if(newPw===null || newPw.trim().length<4) return;
var r = await apiSend('/api/admin/companies/'+req.company_id+'/password','PUT',{password:newPw.trim()});
if(r.ok){
await apiSend('/api/admin/password-reset-requests/'+req.id+'/resolve','PUT');
alert('Password aggiornata. Comunicala tu al cliente.');
await loadResetRequests(); render();
}
};
var dismissBtn = el('button','small-btn','Segna come gestita');
dismissBtn.onclick = async function(){
await apiSend('/api/admin/password-reset-requests/'+req.id+'/resolve','PUT');
await loadResetRequests(); render();
};
row.appendChild(genBtn); row.appendChild(dismissBtn);
reqCard.appendChild(row);
});
frag.appendChild(reqCard);
}

var pendingCompanies = companies.filter(function(c){ return !c.approved; });
var approvedCompanies = companies.filter(function(c){ return c.approved; });

if(pendingCompanies.length>0){
var pendingCard = el('div','card');
pendingCard.appendChild(el('h2',null,'In attesa di approvazione ('+pendingCompanies.length+')'));
pendingCompanies.forEach(function(c){
var row = el('div','input-row');
row.appendChild(el('span',null,'<b>'+c.name.replace(/</g,'&lt;')+'</b> &mdash; '+(c.email?c.email.replace(/</g,'&lt;'):'nessuna email')));
var approveBtn = el('button','small-btn','Approva');
approveBtn.onclick = async function(){
var r = await apiSend('/api/admin/companies/'+c.id+'/approve','PUT');
if(r.ok){ await loadCompanies(); render(); }
};
var rejectBtn = el('button','small-btn danger','Rifiuta');
rejectBtn.onclick = async function(){
if(!confirm('Rifiutare ed eliminare la richiesta di "'+c.name+'"?')) return;
var r = await apiSend('/api/admin/companies/'+c.id,'DELETE');
if(r.ok){ await loadCompanies(); render(); }
};
row.appendChild(approveBtn); row.appendChild(rejectBtn);
pendingCard.appendChild(row);
});
frag.appendChild(pendingCard);
}

var listCard = el('div','card');
listCard.appendChild(el('h2',null,'Aziende ('+approvedCompanies.length+')'));
if(approvedCompanies.length===0){
listCard.appendChild(el('p',null,'Nessuna azienda attiva ancora.'));
} else {
var table = document.createElement('table');
var thead = '<tr><th>Nome</th><th>Email</th><th>Piano</th><th>Stato</th><th>Scadenza</th><th>Creata il</th><th></th></tr>';
var tbody = '';
approvedCompanies.forEach(function(c,idx){
var statoLabel = c.suspended ? '<span style="color:var(--red);font-weight:700;">Sospeso</span>' : '<span style="color:var(--green,#3f8f5c);font-weight:700;">Attivo</span>';
var scadenzaLabel = c.expires_at ? c.expires_at : '<span style="color:var(--text-soft,#888);">nessuna</span>';
var emailLabel = c.email ? c.email.replace(/</g,'&lt;') : '<span style="color:var(--text-soft,#888);">nessuna</span>';
tbody += '<tr data-idx="'+idx+'"><td>'+c.name.replace(/</g,'&lt;')+'</td><td>'+emailLabel+'</td><td>'+(c.plan==='pro'?'PRO':'Free')+'</td><td>'+statoLabel+'</td><td>'+scadenzaLabel+'</td><td>'+(c.created_at||'').slice(0,10)+'</td><td class="actions-'+idx+'"></td></tr>';
});
table.innerHTML = '<thead>'+thead+'</thead><tbody>'+tbody+'</tbody>';
listCard.appendChild(table);
approvedCompanies.forEach(function(c,idx){
var cell = table.querySelector('.actions-'+idx);
var viewBtn = el('button','small-btn','Vedi dati');
viewBtn.onclick = async function(){
viewBtn.textContent = 'Carico...';
var r = await apiGet('/api/admin/companies/'+c.id+'/data');
viewBtn.textContent = 'Vedi dati';
if(r.ok){ viewingData = {name:c.name, json:r.data.data}; render(); }
else { alert('Non sono riuscito a leggere i dati di questa azienda ('+(r.data&&r.data.error?r.data.error:'errore sconosciuto')+').'); }
};
var renameBtnEl = el('button','small-btn','Rinomina');
renameBtnEl.onclick = async function(){
var newName = prompt('Nuovo nome per "'+c.name+'":', c.name);
if(newName===null || !newName.trim()) return;
var r = await apiSend('/api/admin/companies/'+c.id+'/rename','PUT',{name:newName.trim()});
if(r.ok){ await loadCompanies(); render(); }
};
var pwBtn = el('button','small-btn','Reset password');
pwBtn.onclick = async function(){
var newPw = prompt('Nuova password per "'+c.name+'" (almeno 4 caratteri):');
if(newPw===null || newPw.trim().length<4) return;
var r = await apiSend('/api/admin/companies/'+c.id+'/password','PUT',{password:newPw.trim()});
if(r.ok) alert('Password aggiornata.');
};
var suspendBtn = el('button','small-btn', c.suspended?'Riattiva':'Sospendi');
suspendBtn.onclick = async function(){
var action = c.suspended ? 'unsuspend' : 'suspend';
var r = await apiSend('/api/admin/companies/'+c.id+'/'+action,'PUT');
if(r.ok){ await loadCompanies(); render(); }
};
var planBtn = el('button','small-btn', c.plan==='pro'?'Passa a Free':'Passa a Pro');
planBtn.onclick = async function(){
var newPlan = c.plan==='pro' ? 'free' : 'pro';
var r = await apiSend('/api/admin/companies/'+c.id+'/plan','PUT',{plan:newPlan});
if(r.ok){ await loadCompanies(); render(); }
};
var expiryBtn = el('button','small-btn', 'Scadenza');
expiryBtn.onclick = async function(){
var current = c.expires_at || '';
var newDate = prompt('Data di scadenza per "'+c.name+'" (formato AAAA-MM-GG, es. 2026-12-31). Lascia vuoto per nessuna scadenza:', current);
if(newDate===null) return;
newDate = newDate.trim();
var r = await apiSend('/api/admin/companies/'+c.id+'/expiry','PUT',{expiresAt: newDate||null});
if(r.ok){ await loadCompanies(); render(); }
};
var delBtn = el('button','small-btn danger','Elimina');
delBtn.onclick = async function(){
if(!confirm('Eliminare definitivamente "'+c.name+'" e tutti i suoi dati? Non si pu\u00f2 annullare.')) return;
var r = await apiSend('/api/admin/companies/'+c.id,'DELETE');
if(r.ok){ await loadCompanies(); render(); }
};
[viewBtn,renameBtnEl,pwBtn,suspendBtn,planBtn,expiryBtn,delBtn].forEach(function(b){ cell.appendChild(b); });
});
}
frag.appendChild(listCard);
if(viewingData){
var dataCard = el('div','card');
dataCard.appendChild(el('h2',null,'Dati di: '+viewingData.name));
var d = viewingData.json || {};
var isEmpty = Object.keys(d).length===0;
if(isEmpty){
dataCard.appendChild(el('div','notice','Questa azienda non ha ancora effettuato il primo accesso dall\'app: non ci sono ancora dati salvati. Appena il cliente entrer\u00e0 con nome azienda e password, l\u2019app creer\u00e0 da sola la struttura di partenza (sedi, voci, listino) e da qui potrai vederla.'));
}
var kpis = el('div',null,'');
function kpi(label,val){ kpis.appendChild(el('span','kpi-mini', label+': <b>'+val+'</b>')); }
kpi('Sedi', (d.sites||[]).length);
kpi('Voci di costo fisso', (d.fixedItems||[]).length);
kpi('Categorie variabili', (d.varCats||[]).length);
kpi('Prestazioni a listino', (d.listino||[]).length);
kpi('Conti correnti', (d.bankAccounts||[]).length);
kpi('Anno corrente', d.currentYear||'-');
dataCard.appendChild(kpis);
dataCard.appendChild(el('p',null,'Dati completi (formato tecnico):'));
var pre = document.createElement('pre'); pre.className='datajson';
pre.textContent = JSON.stringify(d, null, 2);
dataCard.appendChild(pre);
var closeBtn = el('button','btn secondary','Chiudi');
closeBtn.onclick = function(){ viewingData=null; render(); };
dataCard.appendChild(closeBtn);
frag.appendChild(dataCard);
}
return frag;
}
boot();

</script>
</body>
</html>
